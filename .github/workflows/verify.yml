name: Flippy source checks

on:
  pull_request:
  push:
    branches:
      - main
      - flippy/full-frame-premium-controls-20261112

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (without build side effects)
        run: npm ci --ignore-scripts
      - name: Syntax validation
        run: |
          node --check public/reactions.js
          node --check public/app.js
          node --check server/index.js
      - name: Run unit tests
        run: npm test
